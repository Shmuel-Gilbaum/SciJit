# Read the Docs build configuration for scijit.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # gfortran is required: the docs import the real package, whose subpackages
  # load compiled Fortran libraries built from source during the install below.
  # A REAL import (rather than autodoc_mock_imports) is used so autodoc can read
  # the numba dispatcher and jitclass docstrings. See docs/conf.py for the mock
  # fallback if a build environment cannot provide gfortran.
  apt_packages:
    - gfortran

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
